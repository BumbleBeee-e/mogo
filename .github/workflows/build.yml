name: Build SHANE-AI APK

# Builds the arm64 APK in the cloud so nothing has to be installed locally.
# Public repos get these runners free.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      # Must match app/build.gradle.kts:
      #   compileSdk 36 | ndkVersion 28.2.13676358 | cmake 3.22.1
      # NDK 28 is required: NDK 26 emits 4 KiB LOAD segments that crash on
      # Android 15+ 16 KiB-page runtimes.
      - name: Install Android SDK + NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" \
                    "ndk;28.2.13676358" "cmake;3.22.1"

      # NOTE: `release` is intentionally NOT used. app/build.gradle.kts only sets
      # a signingConfig for release when MH_UPLOAD_* secrets exist, so a release
      # build without them produces an UNSIGNED apk that Android refuses to
      # install. The debug build type is signed with the stock Gradle debug
      # keystore and sideloads fine. Swap in your own keystore to publish.
      - name: Build online debug APK
        run: ./gradlew assembleOnlineDebug --no-daemon --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shane-ai-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Publish the APK as a GitHub Release rather than committing it to git.
      # The APK is ~85-100 MB, right at GitHub's 100 MB hard file limit, and a
      # binary in history is kept forever by every future commit. A Release lets
      # anyone download it from the repo page without bloating the clone.
      # Only the default branch publishes; feature branches stop at the artifact.
      - name: Publish APK as a GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: SHANE-AI ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
          body: |
            **SHANE-AI** - AI mobile coding environment for Android.

            Download the .apk below, transfer it to your phone, and open it.
            Enable *Install unknown apps* when prompted.

            Built from commit ${{ github.sha }}.

            Signed with the stock Gradle debug keystore, so it is for personal
            sideloading only. Uninstall any previous build first - Android
            rejects signature mismatches.

            Requires ARM64, Android 9.0+, ~2.5 GB free storage.